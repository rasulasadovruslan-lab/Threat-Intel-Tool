<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreatScope</title>
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="top"><div class="bar-in">
  <a class="brand" href="#/"><i></i><span>Threat</span><b>Scope</b></a>
  <form id="form" autocomplete="off">
    <span id="kind" class="kind" hidden></span>
    <input id="ind" list="taglist" placeholder="IP, domain, URL, hash, or tag:tor   ( press / )" aria-label="Search">
    <datalist id="taglist"></datalist>
    <button type="button" id="attach" class="icon" title="Attach a log file to scan every IP in it" aria-label="Attach log file">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
    </button>
    <button id="go">Search</button>
  </form>
  <input type="file" id="file" hidden>
  <nav class="nav"><a href="#/">Home</a><a href="#/log">Logs</a><a href="#/bulk">Bulk</a></nav>
</div></header>
<main id="view"></main>
<footer id="status" class="status"></footer>
<div id="drop" class="drop" hidden><div>Drop a log file to scan every IP in it</div></div>
<script src="/app.js"></script>
</body></html>
